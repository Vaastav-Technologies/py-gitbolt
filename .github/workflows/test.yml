name: 🔧 test

on:
  push:
    branches: [main,develop]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.x"]

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 💼 Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group test

      - name: 🧪 Run Doctests and Coverage
        if: ${{ !(matrix.os == 'windows-latest' && matrix.python-version == '3.x') }}
        run: |
          pytest --cov --cov-branch --cov-report=xml --doctest-modules .

      # coverage.py tracing is unreliable on Windows + latest CPython (3.x).
      # Still run the suite; ubuntu/mac 3.x and Windows 3.12/3.13 upload coverage.
      - name: 🧪 Run Doctests
        if: ${{ matrix.os == 'windows-latest' && matrix.python-version == '3.x' }}
        run: |
          pytest --doctest-modules .

      - name: 📈 Upload to Codecov
        if: ${{ !(matrix.os == 'windows-latest' && matrix.python-version == '3.x') }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
